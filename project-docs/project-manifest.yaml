test_gate:                # regression registry -- interpreted by pipeline/test.ps1 via scripts/test-gate.py
  # All suites share ONE server port (5000), ONE database (mydb) and ONE runtime tree
  # (dist/filesys for deployed suites, from connect.config line 3 = "./filesys", which is cwd-relative and MUST
  # stay CRLF -- LF makes dist/Server.exe die at startup). They are therefore NOT parallel_safe
  # and the gate serializes them.
  #
  # Known hazard, RESOLVED on 2026-10-03 (FINDING-GATE-1): all suites killed the server with
  # `taskkill /F /IM Server.exe` -- by IMAGE NAME, which reaches every other suite's process and
  # is indistinguishable from a product crash. It produced three separate "the server died"
  # findings, every one of them another suite's kill. They now share
  # project-docs/evidence/_harness/server_ctl.py, which tracks the PID it started and refuses
  # to kill anything else; a busy port is reported, not blindly cleared.
  #
  # FINDING-GATE-2 closed on 2026-10-09: SEC-001 and unique-login own the deployed
  # dist/Server.exe lifecycle; nested SEC-001 reuses the parent PID. The runner now
  # executes all declared suites and requires their fixed assertion counts.
  status: enforced
  owner: user
  date: 2026-10-09
  reason: >
    Seventeen socket harnesses (565 declared assertions) carry this project's regression
    (share001 added 2026-10-12 with REQ-EXT-SHARE-001; relogoff-login added 2026-10-13
    with the REQ-EXT-SESSION-001 logout/regist-registry regression; reconcile-online added
    2026-10-13 with the REQ-EXT-SESSION-002 startup online-state reconciliation). The
    FINDING-GATE-2 lifecycle blocker is closed: every suite that needs a server starts
    dist/Server.exe itself and cleans only its own PID; unique-login reuses the parent service for
    its nested SEC-001 run. The gate is enforced and blocking on any missing suite, assertion-count
    drift, timeout, or failure. Baseline GREEN re-measured 2026-10-11 (run-20261011-06, candidate
    4e76269): 14 of 14 suites, every observed count equal to its declared count. The three reds
    first seen at 6d597e6 were all non-product and are repaired on the same branch:
    parallel-transfer (the runner took the last `\d+/\d+` in the output, which was "31/32" inside
    trailing NOTE prose rather than the real "54/54"; the suite now prints its summary last),
    transfer003 S-03a/b (a `git diff master` base goes empty once master carries the approved
    block, so the check evaluated a null input; the base is now pinned to the pre-change commit)
    and group-002 (it never reached setup because it required an externally started server; it now
    self-manages, and Server.pro gained CONFIG += console so its p7_slow_conn_dropped drop-log
    assertion has a console to read).
  suites:
    - id: sec001
      cmd: ["py", "project-docs/evidence/REQ-EXT-SEC-001/verify.py"]
      cwd: "."
      asserts: 48
      timeout_s: 300
      blocking: true
      owner: REQ-EXT-SEC-001
      added: 2026-09-29
      note: "security baseline. BASE is derived from __file__ (repo root) instead of a hardcoded literal, so the suite is relocatable; SEC001_BASE still overrides it. D5-adapted IN PLACE on 2026-10-03: its four storage-model assertions (K1c/K1f/K1i-or-K2a/K2b) now read the DB fact layer instead of the filesystem, so this file is NO LONGER byte-identical to its original -- the earlier 'original stays byte-identical' position is retired. It gained a mysql CLI dependency (SEC001_MYSQL / SEC001_DB overridable) and now self-starts dist/Server.exe, while nested unique-login runs reuse the parent PID. Protocol and security assertions are untouched"
