# REQ-EXT-RECLAIM-001 周期清理调度器配置
#
# 读取位置：**Server.exe 所在目录**（applicationDirPath），即部署形态下的 dist/reclaim.cfg。
# 本文件是随源码维护的权威副本与默认值说明；要让它生效，把它放到 Server.exe 旁边。
# 文件缺失、行不合法、数值非正 → 一律回落保守默认，并在 lcFs 打一行提示。
# 所有键都只影响"收得多快/多狠"，不影响正确性：判定与互斥全在 SQL 谓词里，不在这里。
#
# 调参方向速记：
#   磁盘吃紧 → 先调小 staging_ttl_hours / grace_hours（这是纯运营决策：代价是续传现场
#              保留更短、复活窗口更窄），再考虑调大 per_tick / per_round_limit。
#   业务受影响（怀疑清理占了 IO）→ 调小 per_tick，或调大 tick_ms / interval_minutes。
#   判定不确定 → 先 dry_run=1 跑一轮，只看候选、不做任何写，确认判定无误再放开。
#
# 单位说明：两个保留期都以**小时**计。本项目里被收走的都是可再生的临时物，
# 默认取 6 小时 —— 也就是"想观察一次真实回收，最长等 6 小时"。要按天用就写倍数
# （1 天=24、7 天=168、30 天=720），单位不换、判定不变。

enabled=1

# 只统计候选、不做任何写。上线前观察判定用；轮次结束会打印"【dry-run：未做任何写】"。
dry_run=0

# 心跳间隔（毫秒）。每次心跳最多处理 per_tick 条 —— 这是"切片"，把扫盘+unlink
# 切成有界小片，主线程最坏停顿因此可控。
tick_ms=1000

# 两轮之间的间隔（分钟）。一轮 = 一次完整的候选扫描。
interval_minutes=60

# 每次心跳最多动几条。限速的实际旋钮：调小=更温柔，调大=收得更快。
per_tick=20

# 单轮上限（条）。剩下的留给下一轮，避免一轮长时间占着 IO。
per_round_limit=500

# 废弃暂存文件（filesys/.staging/*.part）保留期（小时）。
# 只对"mtime 超过该值且没有任何 uploading/verifying 会话引用"的文件动手。
# 注意这是**暂存文件的生命周期**，与 upload_session.expires_at（会话有效期，1 小时）
# 是两个不同的钟：会话 1 小时就过期，但 .part 有意再留一程供续传。
staging_ttl_hours=6

# 待回收对象（file_object.status='pending_reclaim'）的宽限期（小时）。
# 从"最后一次引用消失"（reclaim_at）起算。这段时间就是"复活窗口"——
# 期间任何人上传同样内容都能秒传命中并把这个对象直接复活。
# 必须 > 0：设成 0 会删掉复活窗口还开着的对象，正是宽限期要防的误删。
grace_hours=6
